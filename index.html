<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snack Luigi - Inicio de Sesión</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="contenedor-login">
        
        <!-- Lado Izquierdo: Banner con Logo -->
        <div class="lado-izquierdo">
            <div class="contenido-banner">
                <div class="logo-burguer">🍔</div>
                <h1>SNACK LUIGI</h1>
                <p class="slogan">Sabor que Enamora...</p>
            </div>
        </div>

        <!-- Lado Derecho: Formulario de ingreso -->
        <div class="lado-derecho">
            <h2>Bienvenido</h2>
            <p class="subtitulo">Inicia sesión para continuar</p>

            <form class="formulario" id="form-login">
                <div class="grupo-campo">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" placeholder="Ingresa tu usuario" required>
                </div>

                <div class="grupo-campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <p id="mensaje-error" style="color: red; font-size: 13px; display: none; margin-bottom: 10px;">
                    ⚠️ Usuario o contraseña incorrectos.
                </p>

                <button type="submit" class="btn-ingresar">Ingresar</button>
            </form>
        </div>

    </div>

    <!-- Vinculamos el archivo de JavaScript externo -->
    <script src="script.js"></script>

</body>
</html>
